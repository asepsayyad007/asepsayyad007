<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <rect width="800" height="200" rx="10" fill="url(#termGrad)" stroke="#30363d" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect width="800" height="30" rx="10" fill="#21262d"/>
  <rect y="20" width="800" height="10" fill="#21262d"/>
  <circle cx="20" cy="15" r="6" fill="#f85149"/>
  <circle cx="40" cy="15" r="6" fill="#d29922"/>
  <circle cx="60" cy="15" r="6" fill="#3fb950"/>
  <text x="400" y="18" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">asep@devops ~ </text>

  <!-- Prompt line 1 -->
  <text x="20" y="65" font-family="'Courier New', monospace" font-size="14" fill="#3fb950">
    <tspan>asep@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan>
    <tspan fill="#c9d1d9">whoami</tspan>
  </text>

  <!-- Output line -->
  <text x="20" y="90" font-family="'Courier New', monospace" font-size="14" fill="#c9d1d9">
    Asep Sayyad | DevOps & AI Engineer | Linux Enthusiast
  </text>

  <!-- Prompt line 2 with typing animation -->
  <text x="20" y="120" font-family="'Courier New', monospace" font-size="14" fill="#3fb950">
    <tspan>asep@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan>
    <tspan fill="#c9d1d9">cat /etc/passion</tspan>
  </text>

  <text x="20" y="145" font-family="'Courier New', monospace" font-size="14" fill="#c9d1d9">
    Automating everything. Breaking nothing. Shipping always.
  </text>

  <!-- Blinking cursor -->
  <text x="20" y="175" font-family="'Courier New', monospace" font-size="14" fill="#3fb950">
    <tspan>asep@linux</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan>
    <tspan fill="#c9d1d9">█</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
