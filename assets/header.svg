<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Asep Sayyad | Linux, Cloud, DevOps and AI Engineer</title>
  <desc id="desc">Linux Systems, Cloud Infrastructure, DevOps, AI and Automation by Asep Sayyad.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101416"/>
      <stop offset="55%" stop-color="#11191a"/>
      <stop offset="100%" stop-color="#0b1012"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8bc8b5"/>
      <stop offset="100%" stop-color="#b5d8cb"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bc8b5" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8bc8b5" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#8bc8b5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <clipPath id="card">
      <rect width="960" height="320" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    .muted { fill: #899694; }
    .white { fill: #edf3f0; }
    .green { fill: #9bcbb9; }

    .rise {
      animation: rise .9s ease-out both;
    }
    .delay1 { animation-delay: .15s; }
    .delay2 { animation-delay: .3s; }

    .cursor {
      animation: blink 1s steps(2) infinite;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .float {
      animation: float 5s ease-in-out infinite alternate;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    @keyframes float {
      to { transform: translateY(-5px); }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="960" height="320" fill="url(#bg)"/>

    <circle cx="790" cy="120" r="190" fill="url(#glow)"/>
    <circle cx="790" cy="120" r="130" fill="#8bc8b5" opacity=".07" filter="url(#blur)"/>

    <rect width="960" height="320" fill="url(#grid)"/>
    <path d="M590 40V280" stroke="#ffffff" stroke-opacity=".07"/>
  </g>

  <rect x=".5" y=".5" width="959" height="319" rx="20"
        fill="none" stroke="url(#border)"/>

  <!-- Availability -->
  <g class="rise">
    <rect x="48" y="35" width="220" height="30" rx="15"
          fill="#9bcbb9" fill-opacity=".07"
          stroke="#9bcbb9" stroke-opacity=".2"/>

    <circle cx="65" cy="50" r="4" fill="#9bcbb9" class="pulse"/>

    <text x="79" y="55" class="mono green" font-size="12">
      LINUX · CLOUD · AI
    </text>
  </g>

  <!-- Main identity -->
  <g class="rise delay1">
    <text x="48" y="139" class="sans white"
          font-size="57" font-weight="700"
          letter-spacing="-2">
      Asep Sayyad
    </text>

    <rect x="49" y="157" width="48" height="3" rx="1.5"
          fill="url(#accent)"/>

    <text x="48" y="193" class="sans"
          font-size="17" fill="#c0cbc6">
      Linux Systems / Cloud / DevOps / AI Engineer
    </text>

    <text x="48" y="225" class="sans muted" font-size="14">
      Building reliable systems, automating workflows
    </text>

    <text x="48" y="246" class="sans muted" font-size="14">
      and developing practical AI-powered tools.
    </text>
  </g>

  <!-- Technical stack -->
  <g class="rise delay2">
    <text x="48" y="285" class="mono" font-size="11" fill="#74847e">
      LINUX
    </text>
    <circle cx="99" cy="281" r="2" fill="#8bc8b5"/>

    <text x="111" y="285" class="mono" font-size="11" fill="#74847e">
      RED HAT
    </text>
    <circle cx="180" cy="281" r="2" fill="#8bc8b5"/>

    <text x="193" y="285" class="mono" font-size="11" fill="#74847e">
      OPENSHIFT
    </text>
    <circle cx="274" cy="281" r="2" fill="#8bc8b5"/>

    <text x="287" y="285" class="mono" font-size="11" fill="#74847e">
      PODMAN
    </text>
    <circle cx="354" cy="281" r="2" fill="#8bc8b5"/>

    <text x="367" y="285" class="mono" font-size="11" fill="#74847e">
      CI/CD
    </text>
  </g>

  <!-- Project terminal -->
  <g class="rise delay2">
    <g class="float">
      <rect x="620" y="48" width="290" height="207" rx="13"
            fill="#151e1e" stroke="#ffffff" stroke-opacity=".12"/>

      <rect x="620" y="48" width="290" height="39" rx="13"
            fill="#1b2625"/>

      <path d="M620 75V87H910V75" fill="#1b2625"/>

      <circle cx="640" cy="67" r="4" fill="#d17b72"/>
      <circle cx="655" cy="67" r="4" fill="#c6a66c"/>
      <circle cx="670" cy="67" r="4" fill="#8bc8b5"/>

      <text x="890" y="71" text-anchor="end"
            class="mono" font-size="11" fill="#7f9690">
        ~/projects
      </text>

      <line x1="620" y1="88" x2="910" y2="88"
            stroke="#ffffff" stroke-opacity=".08"/>

      <text x="642" y="116" class="mono green" font-size="12">
        $ ls ./projects
      </text>

      <circle cx="645" cy="143" r="3" fill="#9bcbb9"/>
      <text x="658" y="147" class="mono white" font-size="13">
        AiroFleet
      </text>
      <text x="875" y="147" text-anchor="end"
            class="mono muted" font-size="10">
        SERVER MONITOR
      </text>

      <circle cx="645" cy="174" r="3" fill="#9bcbb9"/>
      <text x="658" y="178" class="mono white" font-size="13">
        AiroSync
      </text>
      <text x="875" y="178" text-anchor="end"
            class="mono muted" font-size="10">
        REMOTE ACCESS
      </text>

      <circle cx="645" cy="205" r="3" fill="#9bcbb9"/>
      <text x="658" y="209" class="mono white" font-size="13">
        AiroSpeedMonitor
      </text>
      <text x="875" y="209" text-anchor="end"
            class="mono muted" font-size="10">
        WINDOWS APP
      </text>

      <text x="642" y="237" class="mono green" font-size="11">
        $ building what's next
        <tspan class="cursor">_</tspan>
      </text>
    </g>
  </g>

  <!-- Portfolio -->
  <text x="910" y="289" text-anchor="end"
        class="mono" font-size="12" fill="#9bcbb9">
    asepsayyad007.in
  </text>
</svg>
